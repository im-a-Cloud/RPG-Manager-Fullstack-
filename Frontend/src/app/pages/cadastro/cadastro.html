<div class="cadastro-container">
  <h1>Tela de cadastro</h1>

  <form (ngSubmit)="cadastrarUsuario()">
    <label for="nome">Nome:</label><br>
    <input
      type="text"
      id="nome"
      name="nome"
      [(ngModel)]="novoUsuario.nome"
      required><br>

    <label for="email">Email:</label><br>
    <input
      type="email"
      id="email"
      name="email"
      [(ngModel)]="novoUsuario.email"
      required><br>

    <label for="senha">Senha:</label><br>
    <input
      type="password"
      id="senha"
      name="senha"
      [(ngModel)]="novoUsuario.senha"
      required><br>

    <label for="confirmar-senha">Confirmar Senha:</label><br>
    <input
      type="password"
      id="confirmar-senha"
      name="confirmar-senha"
      [(ngModel)]="confirmarSenha"
      required><br>

    <button type="submit">Cadastrar</button><br>
  </form>

  <div *ngIf="mensagem" class="mensagem" [class]="tipoMensagem">
    {{ mensagem }}
  </div>

  <p class="link">
    Já tem conta?
    <a routerLink="/login">Faça login</a>
  </p>
</div>

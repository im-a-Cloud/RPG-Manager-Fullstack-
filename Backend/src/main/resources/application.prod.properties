# ============================================
# PRODUÇÃO (Render)
# ============================================
spring.application.name=RPG_Manager2.0

# ============================================
# SERVER (Render injeta $PORT)
# ============================================
server.port=${PORT:8080}

# ============================================
# DATABASE (variáveis do Render)
# ============================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================================
# CORS (URL da Vercel + localhost para testes)
# ============================================
app.cors.allowed-origins=https://seu-frontend.vercel.app,http://localhost:4200

# ============================================
# LOGGING
# ============================================
logging.level.com.rpg=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================
# JACKSON
# ============================================
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.serialization.fail-on-empty-beans=false

# ============================================
# FILE UPLOAD
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# ERROR HANDLING
# ============================================
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.mvc.log-resolved-exception=false